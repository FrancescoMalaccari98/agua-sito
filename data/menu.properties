# ============================================================================
#  AQUA — CARTA DELLE BEVANDE
#
#  Da questo file si aggiorna il menu del sito: la sezione "La carta" della home
#  e la pagina carta.html (quella collegata al QR code). Non serve toccare il codice.
#
#  COME SI SCRIVE
#  - Ogni riga è  chiave = valore
#  - Le righe che iniziano con # sono commenti: il sito le ignora
#  - Salvare il file in UTF-8 (lettere accentate e simbolo € funzionano)
#  - Prezzi: solo il numero, es. 12 oppure 12,50 (il simbolo € lo aggiunge il sito)
#  - bicchiere: uno di questi →  coppa, martini, calice, flute, tumbler, highball
#  - foto (facoltativa): percorso di un'immagine dentro la cartella assets/img
#
#  AGGIUNGERE UNA BEVANDA  → copiare un blocco e cambiare il numero (es. classici.5.…)
#  TOGLIERE UNA BEVANDA     → cancellare le righe del suo blocco (i numeri possono saltare)
#  CAMBIARE L'ORDINE        → l'ordine segue il numero, dal più piccolo al più grande
#  NUOVA CATEGORIA          → aggiungerla a "categorie" e scrivere le sue righe
#
#  ATTENZIONE: nomi, ingredienti e prezzi qui sotto sono ESEMPI da sostituire
#  con la carta reale del locale.
# ============================================================================


# --- Impostazioni generali --------------------------------------------------

carta.valuta = €

# Categorie, nell'ordine in cui compaiono nelle schede
categorie = signature, classici, zero, vini, champagne


